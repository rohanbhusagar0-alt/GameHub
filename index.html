<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GameHub — Play Instantly</title>
<meta name="description" content="GameHub — browser games you can play instantly without downloading.">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#070b14;color:#f5f7ff}body{overflow-x:hidden}
.top{position:sticky;top:0;z-index:20;background:rgba(7,11,20,.88);backdrop-filter:blur(16px);border-bottom:1px solid #1d2638}
.nav{max-width:1180px;margin:auto;padding:14px 18px;display:flex;align-items:center;gap:18px}.logo{font-size:24px;font-weight:900;letter-spacing:-1px}.logo span{color:#62e6ff}
.search{flex:1;max-width:470px;margin:auto}.search input{width:100%;padding:12px 16px;border:1px solid #27344b;border-radius:14px;background:#0d1422;color:#fff;outline:none}.sound{border:1px solid #27344b;background:#0d1422;color:#fff;border-radius:12px;padding:10px 12px;cursor:pointer}
.hero{max-width:1180px;margin:auto;padding:54px 18px 28px}.eyebrow{color:#62e6ff;font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:2px}.hero h1{font-size:clamp(38px,7vw,72px);line-height:.98;margin:12px 0;max-width:760px;letter-spacing:-3px}.hero p{color:#aeb9cc;max-width:650px;font-size:17px;line-height:1.6}
.chips{display:flex;gap:9px;flex-wrap:wrap;margin-top:24px}.chip{border:1px solid #29364c;background:#0d1422;color:#cdd6e7;padding:9px 14px;border-radius:999px;cursor:pointer}.chip.active,.chip:hover{background:#162438;border-color:#62e6ff;color:#fff}
.section{max-width:1180px;margin:auto;padding:20px 18px}.section h2{margin:0 0 15px;font-size:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.card{background:linear-gradient(160deg,#111a2b,#0b111d);border:1px solid #202d43;border-radius:18px;overflow:hidden;transition:.2s;box-shadow:0 12px 30px #0004}.card:hover{transform:translateY(-4px);border-color:#3d5977}
.thumb{height:140px;display:grid;place-items:center;font-size:54px;background:radial-gradient(circle at 50% 35%,#233958,#0b101c)}.info{padding:14px}.title{font-weight:800}.meta{font-size:12px;color:#8e9bb0;margin:5px 0 12px}.play{width:100%;border:0;border-radius:11px;padding:10px;background:#62e6ff;color:#061018;font-weight:900;cursor:pointer}
.empty{color:#8e9bb0;padding:25px 0}.top-actions{display:flex;gap:8px}.iconbtn{border:1px solid #27344b;background:#0d1422;color:#fff;border-radius:12px;padding:10px 12px;cursor:pointer}.fav{border:1px solid #27344b;background:#0d1422;color:#fff;border-radius:10px;padding:7px 9px;cursor:pointer;float:right}.fav.on{border-color:#ffd75a;color:#ffd75a}.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.stat{padding:8px 11px;border:1px solid #202d43;background:#0d1422;border-radius:12px;color:#aeb9cc;font-size:12px}.stat b{color:#fff}.footer{max-width:1180px;margin:30px auto;padding:25px 18px;color:#718096;border-top:1px solid #1d2638;font-size:13px}
.modal{position:fixed;inset:0;background:#03050bd9;z-index:50;display:none;align-items:center;justify-content:center;padding:14px}.modal.show{display:flex}.panel{width:min(900px,100%);height:min(720px,92vh);background:#080e19;border:1px solid #26354d;border-radius:20px;overflow:hidden;display:flex;flex-direction:column}
.bar{padding:12px 15px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1d293d}.close{background:#182235;color:#fff;border:0;border-radius:9px;padding:8px 12px;cursor:pointer}.gamearea{position:relative;flex:1;display:grid;place-items:center;background:#030711}.gamearea canvas{width:100%;height:100%;max-width:860px;object-fit:contain;touch-action:none}
.hint{position:absolute;bottom:10px;left:0;right:0;text-align:center;color:#8996aa;font-size:12px;pointer-events:none}.controls{position:absolute;bottom:22px;left:18px;right:18px;display:flex;justify-content:space-between;pointer-events:none}
.pad{display:grid;grid-template-columns:52px 52px 52px;grid-template-rows:52px 52px;gap:5px}.pad button,.action{pointer-events:auto;background:#ffffff20;border:1px solid #ffffff30;color:#fff;border-radius:14px;font-size:20px;touch-action:none}.up{grid-column:2}.left{grid-column:1}.down{grid-column:2}.right{grid-column:3}.action{width:68px;height:68px;border-radius:50%}
@media(max-width:600px){.nav{gap:9px}.logo{font-size:20px}.sound{display:none}.hero{padding-top:38px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.thumb{height:105px;font-size:42px}.info{padding:11px}.panel{height:88vh}.hero h1{letter-spacing:-2px}}
</style>
</head>
<body>
<header class="top"><nav class="nav"><div class="logo">Game<span>Hub</span></div><div class="search"><input id="search" placeholder="Search games…" autocomplete="off"></div><div class="top-actions"><button class="iconbtn" id="favoritesBtn">♡ Favorites</button><button class="sound" id="sound">🔊 Sound</button></div></nav></header>
<main><section class="hero"><div class="eyebrow">Instant browser gaming</div><h1>Play. Compete.<br>Have fun.</h1><p>A fast-growing hub for games that launch instantly in your browser. No APK. No download. Just tap Play.</p><div class="chips" id="chips"><button class="chip active" data-cat="All">All</button><button class="chip" data-cat="Arcade">Arcade</button><button class="chip" data-cat="Racing">Racing</button><button class="chip" data-cat="Action">Action</button><button class="chip" data-cat="Puzzle">Puzzle</button><button class="chip" data-cat="Casual">Casual</button></div><div class="stats"><div class="stat">🎮 <b id="gameCount">5</b> games</div><div class="stat">⭐ <b id="favCount">0</b> favorites</div><div class="stat">▶ <b id="playedCount">0</b> played</div></div></section>
<section class="section"><h2 id="sectionTitle">Featured Games</h2><div class="grid" id="grid"></div><div class="empty" id="empty" hidden>No games found.</div></section></main>
<footer class="footer">© 2026 GameHub · Browser games, built for instant play.</footer>
<div class="modal" id="modal"><div class="panel"><div class="bar"><strong id="gameTitle">Game</strong><button class="close" id="close">✕</button></div><div class="gamearea"><canvas id="canvas" width="900" height="600"></canvas><div class="hint" id="hint"></div><div class="controls" id="controls"></div></div></div></div>
<script>
const games=[
{id:'neon',title:'Neon Racer',cat:'Racing',icon:'🏎️',meta:'Arcade racing',badge:'Featured'},
{id:'space',title:'Space Shooter',cat:'Action',icon:'🚀',meta:'Survive the wave',badge:'New'},
{id:'snake',title:'Snake',cat:'Casual',icon:'🐍',meta:'Classic endless'},
{id:'breakout',title:'Breakout',cat:'Arcade',icon:'🧱',meta:'Destroy the bricks'},
{id:'dodge',title:'Dodge',cat:'Arcade',icon:'⚡',meta:'Avoid everything',badge:'New'}
];
let favorites=JSON.parse(localStorage.getItem('gamehub_favorites')||'[]');
let recent=JSON.parse(localStorage.getItem('gamehub_recent')||'[]');
let favoritesOnly=false;
const grid=document.getElementById('grid'),search=document.getElementById('search'),empty=document.getElementById('empty');let cat='All';
function render(){
 let q=search.value.toLowerCase();
 let list=games.filter(g=>(cat==='All'||g.cat===cat)&&(!favoritesOnly||favorites.includes(g.id))&&(g.title+' '+g.cat+' '+g.meta).toLowerCase().includes(q));
 document.getElementById('sectionTitle').textContent=favoritesOnly?'Your Favorites':(cat==='All'?'Featured Games':cat+' Games');
 grid.innerHTML=list.map(g=>`<article class="card"><div class="thumb">${g.icon}</div><div class="info"><button class="fav ${favorites.includes(g.id)?'on':''}" onclick="toggleFav('${g.id}')">${favorites.includes(g.id)?'★':'☆'}</button><div class="title">${g.title}</div><div class="meta">${g.cat} · ${g.meta}${g.badge?' · '+g.badge:''}</div><button class="play" onclick="openGame('${g.id}')">▶ Play Now</button></div></article>`).join('');
 empty.hidden=list.length>0;
 document.getElementById('gameCount').textContent=games.length;
 document.getElementById('favCount').textContent=favorites.length;
 document.getElementById('playedCount').textContent=recent.length;
}
function toggleFav(id){favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];localStorage.setItem('gamehub_favorites',JSON.stringify(favorites));render()}
document.getElementById('favoritesBtn').onclick=()=>{favoritesOnly=!favoritesOnly;document.getElementById('favoritesBtn').textContent=favoritesOnly?'✕ All Games':'♡ Favorites';render()};
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');cat=b.dataset.cat;favoritesOnly=false;document.getElementById('favoritesBtn').textContent='♡ Favorites';render()});
search.oninput=render;render();

const modal=document.getElementById('modal'),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),title=document.getElementById('gameTitle'),hint=document.getElementById('hint'),controls=document.getElementById('controls');let raf=0,keys={};
function openGame(id){cancelAnimationFrame(raf);title.textContent=games.find(x=>x.id===id).title;modal.classList.add('show');controls.innerHTML='';keys={};recent=[id,...recent.filter(x=>x!==id)].slice(0,10);localStorage.setItem('gamehub_recent',JSON.stringify(recent));render();if(id==='neon')runRacer();if(id==='space')runSpace();if(id==='snake')runSnake();if(id==='breakout')runBreakout();if(id==='dodge')runDodge()}
function closeGame(){modal.classList.remove('show');cancelAnimationFrame(raf)}document.getElementById('close').onclick=closeGame;modal.onclick=e=>{if(e.target===modal)closeGame()};
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function fit(){let r=canvas.getBoundingClientRect(),d=devicePixelRatio||1;canvas.width=Math.max(500,r.width*d);canvas.height=Math.max(350,r.height*d);ctx.setTransform(d,0,0,d,0,0);return{w:r.width,h:r.height}}
function button(label,key,cls=''){let b=document.createElement('button');b.textContent=label;b.className=cls;b.onpointerdown=()=>keys[key]=true;b.onpointerup=b.onpointercancel=()=>keys[key]=false;return b}
function racerControls(){let p=document.createElement('div');p.className='pad';p.append(button('▲','arrowup','up'),button('◀','arrowleft','left'),button('▼','arrowdown','down'),button('▶','arrowright','right'));controls.append(p)}
function runRacer(){hint.textContent='Arrow keys / touch controls · Reach the finish';racerControls();let t=0,carX=450,score=0,ob=[];function loop(){let{w,h}=fit();t++;ctx.fillStyle='#050a12';ctx.fillRect(0,0,w,h);let road=w*.62,l=(w-road)/2;ctx.fillStyle='#151d29';ctx.fillRect(l,0,road,h);ctx.strokeStyle='#536074';ctx.setLineDash([35,28]);ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(w/2,0);ctx.lineTo(w/2,h);ctx.stroke();ctx.setLineDash([]);if(keys.arrowleft||keys.a)carX-=5;if(keys.arrowright||keys.d)carX+=5;carX=Math.max(l+28,Math.min(l+road-28,carX));if(t%45===0)ob.push({x:l+35+Math.random()*(road-70),y:-40});ob.forEach(o=>o.y+=5);ob=ob.filter(o=>o.y<h+60);ctx.fillStyle='#62e6ff';ctx.fillRect(carX-22,h-85,44,68);ctx.fillStyle='#08101b';ctx.fillRect(carX-15,h-74,30,16);ctx.fillRect(carX-15,h-38,30,12);ctx.fillStyle='#ff5577';ob.forEach(o=>{ctx.fillRect(o.x-22,o.y,44,68);if(Math.abs(o.x-carX)<40&&Math.abs(o.y-(h-85))<60){score=0;ob=[]}});score++;ctx.fillStyle='#fff';ctx.font='700 18px system-ui';ctx.fillText('Score '+Math.floor(score/10),16,30);raf=requestAnimationFrame(loop)}loop()}
function runSpace(){hint.textContent='Move with ← → or A/D · Tap/Space to fire';let{w,h}=fit(),x=w/2,bul=[],en=[],tick=0,score=0;function loop(){({w,h}=fit());if(keys.arrowleft||keys.a)x-=6;if(keys.arrowright||keys.d)x+=6;x=Math.max(20,Math.min(w-20,x));if((keys[' ']||keys.enter)&&tick%8===0)bul.push({x,y:h-65});bul.forEach(b=>b.y-=9);if(tick%35===0)en.push({x:20+Math.random()*(w-40),y:-20});en.forEach(e=>e.y+=2.5);bul.forEach(b=>en.forEach(e=>{if(Math.abs(b.x-e.x)<18&&Math.abs(b.y-e.y)<18){e.dead=1;b.dead=1;score+=10}}));en=en.filter(e=>!e.dead&&e.y<h+30);bul=bul.filter(b=>!b.dead&&b.y>-20);ctx.fillStyle='#020611';ctx.fillRect(0,0,w,h);for(let i=0;i<70;i++){ctx.fillStyle='#ffffff55';ctx.fillRect((i*97)%w,(i*53+tick)%h,2,2)}ctx.fillStyle='#62e6ff';ctx.beginPath();ctx.moveTo(x,h-80);ctx.lineTo(x-22,h-35);ctx.lineTo(x+22,h-35);ctx.closePath();ctx.fill();ctx.fillStyle='#ff5577';en.forEach(e=>ctx.fillRect(e.x-14,e.y-14,28,28));ctx.fillStyle='#ffe36e';bul.forEach(b=>ctx.fillRect(b.x-2,b.y,4,12));ctx.fillStyle='#fff';ctx.font='700 18px system-ui';ctx.fillText('Score '+score,16,30);tick++;raf=requestAnimationFrame(loop)}loop()}
function runSnake(){hint.textContent='Arrow keys / touch controls · Eat food and grow';let{w,h}=fit(),size=18,s=[{x:10,y:10}],dir={x:1,y:0},food={x:20,y:10},tick=0,score=0;controls.append(button('↑','arrowup','up'),button('←','arrowleft','left'),button('↓','arrowdown','down'),button('→','arrowright','right'));function loop(){({w,h}=fit());if(keys.arrowup&&dir.y===0)dir={x:0,y:-1};if(keys.arrowdown&&dir.y===0)dir={x:0,y:1};if(keys.arrowleft&&dir.x===0)dir={x:-1,y:0};if(keys.arrowright&&dir.x===0)dir={x:1,y:0};if(tick++%7===0){let head={x:s[0].x+dir.x,y:s[0].y+dir.y},cols=Math.floor(w/size),rows=Math.floor(h/size);if(head.x<0||head.y<0||head.x>=cols||head.y>=rows||s.some(p=>p.x===head.x&&p.y===head.y)){s=[{x:10,y:10}];dir={x:1,y:0};score=0}else{s.unshift(head);if(head.x===food.x&&head.y===food.y){score++;food={x:Math.floor(Math.random()*cols),y:Math.floor(Math.random()*rows)}}else s.pop()}}ctx.fillStyle='#050a12';ctx.fillRect(0,0,w,h);ctx.fillStyle='#ff5577';ctx.fillRect(food.x*size,food.y*size,size-2,size-2);ctx.fillStyle='#62e6ff';s.forEach(p=>ctx.fillRect(p.x*size,p.y*size,size-2,size-2));ctx.fillStyle='#fff';ctx.font='700 18px system-ui';ctx.fillText('Score '+score,16,30);raf=requestAnimationFrame(loop)}loop()}
function runBreakout(){hint.textContent='Move paddle with ← → · Clear all bricks';let{w,h}=fit(),px=w/2,b={x:w/2,y:h-100,vx:4,vy:-4},paddle=90,bricks=[];for(let r=0;r<5;r++)for(let c=0;c<9;c++)bricks.push({x:25+c*(w-50)/9,y:55+r*27,w:(w-70)/9,h:20,on:1});function loop(){({w,h}=fit());if(keys.arrowleft||keys.a)px-=7;if(keys.arrowright||keys.d)px+=7;px=Math.max(paddle/2,Math.min(w-paddle/2,px));b.x+=b.vx;b.y+=b.vy;if(b.x<7||b.x>w-7)b.vx*=-1;if(b.y<7)b.vy*=-1;if(b.y>h-55&&Math.abs(b.x-px)<paddle/2&&b.vy>0)b.vy=-Math.abs(b.vy);if(b.y>h+20){b={x:w/2,y:h-100,vx:4,vy:-4};bricks.forEach(x=>x.on=1)}bricks.forEach(q=>{if(q.on&&b.x>q.x&&b.x<q.x+q.w&&b.y>q.y&&b.y<q.y+q.h){q.on=0;b.vy*=-1}});ctx.fillStyle='#050a12';ctx.fillRect(0,0,w,h);bricks.forEach(q=>{if(q.on){ctx.fillStyle='#62e6ff';ctx.fillRect(q.x,q.y,q.w-5,q.h)}});ctx.fillStyle='#fff';ctx.fillRect(px-paddle/2,h-38,paddle,12);ctx.fillStyle='#ff5577';ctx.beginPath();ctx.arc(b.x,b.y,8,0,Math.PI*2);ctx.fill();raf=requestAnimationFrame(loop)}loop()}
function runDodge(){hint.textContent='Move with ← → · Survive as long as possible';let{w,h}=fit(),x=w/2,obs=[],tick=0,score=0;function loop(){({w,h}=fit());if(keys.arrowleft||keys.a)x-=6;if(keys.arrowright||keys.d)x+=6;x=Math.max(18,Math.min(w-18,x));if(tick%28===0)obs.push({x:18+Math.random()*(w-36),y:-20,s:12+Math.random()*18});obs.forEach(o=>o.y+=4+o.s/8);obs=obs.filter(o=>o.y<h+30);if(obs.some(o=>Math.abs(o.x-x)<o.s+15&&Math.abs(o.y-(h-60))<o.s+20)){score=0;obs=[]}else score++;ctx.fillStyle='#050a12';ctx.fillRect(0,0,w,h);ctx.fillStyle='#ff5577';obs.forEach(o=>{ctx.beginPath();ctx.arc(o.x,o.y,o.s,0,Math.PI*2);ctx.fill()});ctx.fillStyle='#62e6ff';ctx.fillRect(x-16,h-55,32,32);ctx.fillStyle='#fff';ctx.font='700 18px system-ui';ctx.fillText('Score '+Math.floor(score/10),16,30);tick++;raf=requestAnimationFrame(loop)}loop()}
</script>
</body>
</html>
